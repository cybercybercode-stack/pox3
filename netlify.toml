[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/**"]

# إعادة توجيه الروابط لتكون نظيفة وقصيرة
[[redirects]]
  from = "/api/bot"
  to = "/.netlify/functions/bot"
  status = 200

[[redirects]]
  from = "/api/set-webhook"
  to = "/.netlify/functions/set-webhook"
  status = 200
